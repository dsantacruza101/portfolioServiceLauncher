version: '3.8'
services:

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client-gateway
    networks:
      - portfolio-network
    restart: always

  nats-server:
    image: nats:alpine3.21
    command: ["-c", "/etc/nats/nats-server.conf"]
    # no ports — NATS is internal only in production
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./certs:/certs:ro
    environment:
      - NATS_TOKEN=${NATS_TOKEN}
    healthcheck:
      test: ["CMD", "nats-server", "--check"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-network
    restart: always

  client-gateway:
    build:
      context: ./client-gateway
      dockerfile: dockerfile.prod
    image: client-gateway-prod
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    environment:
      - PORT=${CLIENT_GATEWAY_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
      - NATS_TOKEN=${NATS_TOKEN}
      - NODE_EXTRA_CA_CERTS=/certs/ca.crt
      - TZ=${TZ}
      - CORS_ENV=${CORS_ENV}
      - CORS_ALLOW_DOMAINS=${CORS_ALLOW_DOMAINS}
      - HCAPTCHA_SECRET=${HCAPTCHA_SECRET}
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      nats-server:
        condition: service_healthy
    networks:
      - portfolio-network
    restart: always

  nodemailer-micro-service:
    build:
      context: ./nodeMailer-ms
      dockerfile: dockerfile.prod
    image: nodemailer-micro-service-prod
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    environment:
      - NATS_SERVERS=${NATS_SERVERS}
      - NATS_TOKEN=${NATS_TOKEN}
      - NODE_EXTRA_CA_CERTS=/certs/ca.crt
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - OWNER_EMAIL=${OWNER_EMAIL}
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      nats-server:
        condition: service_healthy
    networks:
      - portfolio-network
    restart: always

volumes:
  caddy_data:
  caddy_config:

networks:
  portfolio-network:
    driver: bridge
